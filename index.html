<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed | Software Engineer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #0b1120;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            max-width: 750px;
            width: 100%;
            padding: 55px 45px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
        }

        .badge {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 50px;
            background: #172554;
            color: #60a5fa;
            font-size: 14px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(40px, 7vw, 70px);
            margin-bottom: 15px;
            letter-spacing: -2px;
        }

        h1 span {
            color: #60a5fa;
        }

        p {
            color: #94a3b8;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        a {
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .primary {
            background: #3b82f6;
            color: white;
        }

        .primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .secondary {
            border: 1px solid #334155;
            color: #cbd5e1;
        }

        .secondary:hover {
            background: #1e293b;
        }

        .status {
            margin-top: 35px;
            color: #64748b;
            font-size: 13px;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="badge">⚡ Software Engineer</div>

        <h1>Hi, I'm <span>Ahmed.</span></h1>

        <p>
            I build modern backend systems, AI-powered applications,
            and scalable software with Python, FastAPI and cloud technologies.
        </p>

        <div class="buttons">
            <a class="primary" href="https://github.com/Ahmedmalik414">
                GitHub
            </a>

            <a class="secondary" href="#">
                Explore Projects
            </a>
        </div>

        <div class="status">
            <span class="dot"></span>
            Deployed on AWS EC2
        </div>

    </div>

</body>
</html>
